<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ 취향 저격 MBTI 퀴즈 ✨</title>
    <style>
        :root {
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --primary: #818cf8;
            --primary-dark: #6366f1;
            --text-main: #1f2937;
            --text-sub: #4b5563;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Pretendard', -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        /* 공통 섹션 스타일 */
        .page-section {
            width: 100vw;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
            padding: 40px 20px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 40px 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.06);
            width: 100%;
            max-width: 520px;
            text-align: center;
            box-sizing: border-box;
            position: relative;
        }

        /* 1. 인트로 섹션 */
        #intro-section {
            background: linear-gradient(135deg, #eeeedf 0%, #e0e7ff 100%);
        }
        .intro-emoji { font-size: 5rem; margin-bottom: 10px; animation: bounce 2s infinite; }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        
        /* 2. 퀴즈 섹션 */
        #quiz-section { background-color: #f9fafb; }
        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }
        .progress-container {
            width: 70%;
            height: 8px;
            background: #e5e7eb;
            border-radius: 4px;
            overflow: hidden;
        }
        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--primary), var(--primary-dark));
            transition: width 0.3s ease;
        }
        .q-count { font-weight: bold; color: var(--primary-dark); font-size: 0.95rem; }
        
        .question-box {
            font-size: 1.3rem;
            font-weight: 700;
            line-height: 1.5;
            margin: 40px 0;
            min-height: 70px;
            word-break: keep-all;
        }

        /* 버튼 스타일 */
        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 16px 32px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(129, 140, 248, 0.3);
        }
        .btn:hover {
            background-color: var(--primary-dark);
            transform: translateY(-2px);
        }

        .option-btn {
            width: 100%;
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            padding: 18px 24px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 16px;
            cursor: pointer;
            margin-bottom: 14px;
            text-align: left;
            color: var(--text-sub);
            transition: all 0.2s ease;
            line-height: 1.4;
        }
        .option-btn:hover {
            background: #f0fdf4;
            border-color: #34d399;
            color: var(--text-main);
            transform: scale(1.01);
        }

        /* 3. 결과 섹션 */
        #result-section {
            background: linear-gradient(185deg, #f8fafc 0%, #f1f5f9 100%);
            display: none; /* 테스트 완료 전엔 숨김 */
        }
        .res-emoji { font-size: 5.5rem; margin: 15px 0; }
        .res-mbti { font-size: 3rem; font-weight: 900; color: var(--primary-dark); letter-spacing: -1px; margin: 0;}
        .res-title { font-size: 1.3rem; font-weight: 700; color: var(--text-sub); margin-top: 5px; }
        
        .analysis-box {
            text-align: left;
            margin-top: 30px;
        }
        .info-card {
            background: #f8fafc;
            border-left: 4px solid var(--primary);
            padding: 16px;
            border-radius: 0 12px 12px 0;
            margin-bottom: 16px;
        }
        .info-card h3 { margin: 0 0 8px 0; font-size: 1rem; color: var(--primary-dark); }
        .info-card p, .info-card ul { margin: 0; font-size: 0.95rem; color: var(--text-sub); line-height: 1.6; }
        .info-card ul { padding-left: 20px; }

    </style>
</head>
<body>

    <!-- SECTION 1: 인트로 -->
    <section id="intro-section" class="page-section">
        <div class="card">
            <div class="intro-emoji">🔮</div>
            <h1 style="font-size: 2.2rem; font-weight: 800; margin-bottom: 10px; letter-spacing: -1px;">나를 찾아 떠나는 퀴즈</h1>
            <p style="color: var(--text-sub); line-height: 1.6; margin-bottom: 35px;">
                복잡한 생각은 접어두고 마음에 이끌리는 대로!<br>
                간결한 32개 퀴즈로 알아보는 입체적 MBTI 분석
            </p>
            <button class="btn" onclick="scrollToQuiz()">테스트 시작하기 👇</button>
        </div>
    </section>

    <!-- SECTION 2: 퀴즈 체임버 -->
    <section id="quiz-section" class="page-section">
        <div class="card">
            <div class="quiz-header">
                <div class="progress-container"><div id="progress" class="progress-bar"></div></div>
                <div id="q-count" class="q-count">Q. 1 / 32</div>
            </div>
            
            <div id="question-text" class="question-box">질문 문항이 이곳에 노출됩니다.</div>
            
            <button id="optA" class="option-btn" onclick="next('A')">선택지 A 버튼입니다.</button>
            <button id="optB" class="option-btn" onclick="next('B')">선택지 B 버튼입니다.</button>
        </div>
    </section>

    <!-- SECTION 3: 결과 리포트 -->
    <section id="result-section" class="page-section">
        <div class="card">
            <p style="font-size: 0.9rem; font-weight: bold; color: var(--primary-dark); margin: 0; text-transform: uppercase;">YOUR TYPE IS</p>
            <div id="res-emoji" class="res-emoji">🦄</div>
            <h2 id="res-mbti" class="res-mbti">INFP</h2>
            <div id="res-title" class="res-title">낭만 가득한 감성 보스</div>
            
            <div class="analysis-box">
                <div class="info-card">
                    <h3>🔍 어떤 캐릭터인가요?</h3>
                    <p id="res-desc">설명이 들어갑니다.</p>
                </div>
                <div class="info-card" style="border-left-color: #34d399;">
                    <h3>✨ 이런 장점이 빛나요</h3>
                    <ul id="res-pros"></ul>
                </div>
                <div class="info-card" style="border-left-color: #f87171;">
                    <h3>⚠️ 이 부분은 보완하면 좋아요</h3>
                    <ul id="res-cons"></ul>
                </div>
            </div>
            
            <button class="btn" style="width: 100%; margin-top: 20px; background: var(--text-main);" onclick="restart()">다시 도전하기 🔄</button>
        </div>
    </section>

    <script>
        // 32가지 밸런스 질문 셋업
        const questions = [
            { type: "EI", q: "주말인데 만나기로 한 친구가 파토를 냈다. 나의 심정은?", a: "아 텐션 떨어지네... 누구 딴 사람이라도 부를까?", b: "오예! 완전 합법적 방콕 가능! 침대야 기다려라" },
            { type: "EI", q: "파티나 모임에서 모르는 사람들과 섞여 있을 때 나는?", a: "어색한 건 못 참지! 먼저 나서서 말을 건넨다", b: "구석자리 명당을 찾아 조용히 리액션만 한다" },
            { type: "EI", q: "친구들과 노래방이나 활기찬 곳에 다녀온 직후 나는?", a: "에너지가 빵빵하게 충전되어 잠이 안 온다", b: "배터리 방전... 영혼까지 털려서 기절하기 직전이다" },
            { type: "EI", q: "새로운 취미를 배운다면 어떤 방식을 선호해?", a: "사람들과 으쌰으쌰 동호회에 가입해서 배운다", b: "유튜브나 1:1 클래스로 조용히 혼자 독학한다" },
            { type: "EI", q: "내가 생각하는 이상적인 대화 패턴은?", a: "오디오가 비지 않게 티키타카 핑퐁이 잘 되는 대화", b: "진중하게 한 사람씩 끝까지 경청해주는 대화" },
            { type: "EI", q: "단골 카페의 사장님이 아는 척을 하며 친근하게 다가오면?", a: "단골 인증 받은 것 같아 기분 좋고 수다 떨 맛 난다", b: "다음부턴 다른 카페로 가야 하나 내심 부담스럽다" },
            { type: "EI", q: "문제를 해결할 때 생각하는 스타일은?", a: "말을 밖으로 뱉으면서 내 생각을 정리하는 편", b: "속으로 생각 정리를 끝마치고 최종 결론만 말하는 편" },
            { type: "EI", q: "일주일 동안 강제로 '집 밖 출입 금지'가 떨어진다면?", a: "3일 차부터 좀이 쑤시고 미쳐버릴 것 같다", b: "일주일? 한 달도 쌉가능. 천국이 따로 없다" },

            { type: "SN", q: "숲길을 걸을 때 내 머릿속에 드는 생각은?", a: "풀 냄새 좋다, 나무가 되게 울창하네", b: "여기 멧돼지 나오면 어쩌지? 요정이 살 것 같아" },
            { type: "SN", q: "SF 소설이나 영화를 볼 때 나의 반응은?", a: "스토리나 특수효과가 짜임새 있는지 관찰한다", b: "내가 저 세계관에 빠지면 어떨지 뇌내 망상을 돌린다" },
            { type: "SN", q: "누가 나에게 설명해 줄 때 좋아하는 방식은?", a: "정확한 수치와 전후 데이터가 들어간 확실한 팩트 설명", b: "비유나 은유를 들어서 전체적인 흐름을 깨닫게 해주는 설명" },
            { type: "SN", q: "‘만약에 지구에 좀비 사태가 터지면?’ 이라는 질문을 받으면?", a: "일어날 리 없는 일에 왜 시간 낭비해?", b: "이미 내 머릿속에 생존 가방이랑 도망칠 루트 다 짜둠" },
            { type: "SN", q: "음식점에 갔을 때 메뉴를 고르는 기준은?", a: "내가 먹어봤던 보장된 맛이나 베스트 메뉴 선택", b: "처음 보는 신박하고 모험적인 시그니처 메뉴 도전" },

            { type: "TF", q: "친구가 내 패션을 보고 어울리지 않는다고 지적한다면?", a: "왜? 어디가 별로인데? (객관적인 이유가 궁금함)", b: "말을 꼭 그렇게 해야 하나? 은근히 서운하고 상처받음" },
            { type: "TF", q: "내가 생각하는 진짜 멋진 칭찬은?", a: "“너 일 진짜 야무지게 잘한다. 최고야.”", b: "“너랑 있으면 마음이 너무 편해져. 좋은 사람이야.”" },
            { type: "TF", q: "누군가와 토론이나 의견 다툼을 할 때 내 태도는?", a: "내 감정과 상관없이 논리적 오류를 바로잡는 게 우선", b: "상대방 기분이 상하지 않게 완곡한 표현을 골라 말함" },
            { type: "TF", q: "연인이 “나 차 사고 났어”라고 전화가 왔을 때 먼저 나갈 말은?", a: "헐 보험은 불렀어? 다친 데는 없고? 과실은?", b: "헐 진짜?? 어디 안 다쳤어?? 깜짝 놀랐겠다 ㅠㅠ" },

        // 16가지 결과 데이터베이스
        const mbtiDB = {
